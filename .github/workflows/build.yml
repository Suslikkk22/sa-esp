name: Build ASI Plugin

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clone plugin-sdk
      uses: actions/checkout@v4
      with:
        repository: DK22Pac/plugin-sdk
        path: plugin-sdk

    # Используем актуальную версию экшена для настройки MSBuild
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Configure CMake
      run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32

    - name: Build Project
      run: cmake --build build --config Release

    - name: Upload ASI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AmazingTreasureESP
        path: build/Release/AmazingTreasureESP.asi

name: Build ASI Plugin

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Надежно скачиваем plugin-sdk через обычный git clone
    - name: Clone plugin-sdk
      run: git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git plugin-sdk

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Configure CMake
      run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32

    - name: Build Project
      run: cmake --build build --config Release

    - name: Upload ASI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AmazingTreasureESP
        path: build/Release/AmazingTreasureESP.asi

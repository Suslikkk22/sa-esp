name: Build ASI Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download plugin-sdk stable snapshot
      shell: pwsh
      run: |
        if (Test-Path "plugin-sdk") {
          Remove-Item -Recurse -Force "plugin-sdk"
        }
        # Скачиваем стабильный архив репозитория, избегая проблем с git checkout на винде
        Invoke-WebRequest -Uri "https://github.com/DK22Pac/plugin-sdk/archive/refs/heads/master.zip" -OutFile "master.zip"
        Expand-Archive -Path "master.zip" -DestinationPath "."
        Rename-Item "plugin-sdk-master" "plugin-sdk"
        Remove-Item "master.zip"

    - name: Configure CMake (C++20 Mode)
      run: cmake -B build -S . -A Win32 -DCMAKE_CXX_STANDARD=20 -DCMAKE_CXX_STANDARD_REQUIRED=ON

    - name: Build Project
      run: cmake --build build --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AmazingTreasureESP-ASI
        path: build/Release/*.asi

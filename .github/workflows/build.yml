name: Build ASI Plugin

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Configure and Build with MSBuild
      run: |
        mkdir build
        cd build
        # Если у тебя нет CMakeLists.txt, мы можем скомпилировать через MSBuild напрямую, 
        # но если проект использует .vcxproj, укажи путь к нему:
        msbuild ../AmazingTreasureESP.vcxproj /p:Configuration=Release /p:Platform=Win32
      shell: cmd

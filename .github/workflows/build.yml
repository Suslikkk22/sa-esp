name: Build ASI Plugin

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clone Plugin-SDK cleanly
      run: |
        git clone --recursive https://github.com/DK22Pac/plugin-sdk.git plugin-sdk-temp
        move plugin-sdk-temp plugin-sdk
      shell: cmd

    - name: Patch SafetyHook and Injector for Modern MSVC
      run: |
        REM 1. Патчим safetyhook заглушкой
        if exist plugin-sdk\safetyhook rmdir /s /q plugin-sdk\safetyhook
        mkdir plugin-sdk\safetyhook
        echo #pragma once > plugin-sdk\safetyhook\safetyhook.hpp

        REM 2. Исправляем ошибку конвертации uintptr_t в hooking.hpp на строке 280
        powershell -Command "(Get-Content plugin-sdk\injector\hooking.hpp) -replace 'return fn;', 'return injector::basic_memory_pointer<injector::address_manager::fn_mem_translator_nop>(fn);' | Set-Content plugin-sdk\injector\hooking.hpp"

        echo "All patches applied successfully!"
      shell: cmd

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Configure with CMake
      run: cmake -S . -B build -A Win32
      shell: cmd

    - name: Build Project
      run: cmake --build build --config Release
      shell: cmd

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AmazingTreasureESP-ASI
        path: build/Release/AmazingTreasureESP.asi

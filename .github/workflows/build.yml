name: Build ASI Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download stable plugin-sdk
      uses: robinraju/release-downloader@v10
      with:
        repository: "DK22Pac/plugin-sdk"
        tag: "latest" # Или скачаем через архив по прямой ссылке ниже
        out-file-path: "plugin-sdk"
